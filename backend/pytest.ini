[pytest]
minversion = 7.0
pythonpath = .
testpaths = tests
asyncio_mode = auto
; `addopts` names no coverage option, so a bare `pytest` and a `--collect-only`
; run neither measure nor gate. The measured scope and the threshold are
; arguments of the CI step and of the documented gated command; the report
; precision the threshold is compared at is declared in `backend/.coveragerc`.
; `backend/tests/test_coverage_gate.py` asserts both. Reasoning: rows D195,
; D226, D252 and D291 of docs/testing/DECISION-LOG.md.
addopts = -ra --strict-markers --junitxml=reports/junit.xml
junit_family = xunit2
; Captured log records travel with a FAILING <testcase>, formatted by `log_format`
; below. A passing test carries no log section.
junit_logging = log
junit_log_passing_tests = false
; Live and captured log records both carry `correlation_id`, the short stable
; digest of the running test's nodeid that `tests/conftest.py` puts on every
; record through a log-record factory. The same nodeid is the `classname` and
; `name` pair of the matching <testcase> in reports/junit.xml, so a log line,
; a captured-log section and a result all lead back to one test. A record
; emitted outside a test reads `session`.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s [%(correlation_id)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_format = %(asctime)s %(levelname)-8s [%(correlation_id)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
    ignore:You are using a (non-supported )?Python version:FutureWarning:google\.api_core\._python_version_support
markers =
    unit: isolated unit test; every external client and boundary is patched.
    integration: exercises the FastAPI HTTP surface through starlette TestClient.
