; ===========================================================================
; Code Skeptic Scanner - backend pytest configuration
;
; The repository previously had NO pytest configuration of any kind, and the
; three legacy test modules imported from three mutually exclusive roots
; (`app.main`, `services.*`, `backend.tasks`).  This file establishes ONE
; import root:
;
;     `pythonpath = .` + invoking pytest from `backend/`  =>  `app.*`
;
; No test file should ever manipulate sys.path.
;
; Run from the `backend/` directory:
;     cd backend
;     pytest
;     pytest --collect-only -q                      # collection-integrity gate
;     pytest --cov=app --cov-report=term-missing
; ===========================================================================
[pytest]
minversion = 7.0

; Single import root. `rootdir` is NOT a valid ini key - the root comes from
; invoking pytest with `backend/` as the working directory.
pythonpath = .

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

; pytest-asyncio: `auto` means `async def test_*` needs no decorator, which the
; async task suites (app/tasks/response_generator.py) rely on.
asyncio_mode = auto

addopts =
    -ra
    --strict-markers
    --junitxml=reports/junit.xml

junit_family = xunit2

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    default
    ; starlette 0.27 passes `app=` to httpx.Client; harmless with the pinned
    ; httpx 0.27.2, but noisy on every TestClient construction.
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
    ; google-api-core / google-auth emit Python-3.9 deprecation notices.
    ignore::FutureWarning:google.*
    ignore::DeprecationWarning:google.*

markers =
    unit: fast, fully isolated unit test - every external client is patched.
    integration: exercises the FastAPI HTTP surface via starlette TestClient.
