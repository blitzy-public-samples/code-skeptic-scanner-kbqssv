[pytest]
minversion = 7.0
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = -ra --strict-markers --junitxml=reports/junit.xml --basetemp=.pytest_cache
junit_family = xunit2
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
filterwarnings =
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
    ignore::FutureWarning:google.*
markers =
    unit: isolated unit test; every external client and boundary is patched.
    integration: exercises the FastAPI HTTP surface through starlette TestClient.
