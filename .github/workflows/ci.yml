name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.9]
        node-version: [16.x]

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: Install Node.js dependencies
      working-directory: frontend
      run: |
        npm install

    - name: Run backend linting and type checking
      run: |
        flake8 .
        mypy .

    - name: Run frontend linting
      run: |
        npm run lint

    - name: Run backend tests
      working-directory: backend
      run: |
        pytest --cov=app/core --cov=app/services --cov=app/tasks --cov=app/db --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=reports/junit.xml

    - name: Run frontend tests
      working-directory: frontend
      run: |
        npm run test:ci

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v1
      with:
        file: ./backend/coverage.xml
        flags: backend

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v1
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js 16.x
      uses: actions/setup-node@v2
      with:
        node-version: 16.x

    - name: Install frontend dependencies
      working-directory: frontend
      run: |
        npm install

    - name: Install e2e dependencies
      working-directory: e2e
      run: |
        npm install

    - name: Install Playwright browsers
      working-directory: e2e
      run: |
        npx playwright install --with-deps chromium

    - name: Run end-to-end tests
      run: |
        npx playwright test --config e2e/playwright.config.ts

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e/playwright-report/

# HUMAN ASSISTANCE NEEDED
# Please review the following:
# 1. Ensure that the Python and Node.js versions are appropriate for your project.
# 2. Verify that the file paths for requirements.txt, test files, and coverage reports are correct.
# 3. Confirm that the linting, type checking, and testing commands match your project's setup.
# 4. Check if additional environment variables or secrets are needed for the workflow.